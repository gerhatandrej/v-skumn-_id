<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <title>Generátor výskumného ID</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: 60px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    #successMsg {
      margin-top: 20px;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Získaj svoje výskumné ID</h2>
  <form id="idForm">
    <input type="email" id="email" placeholder="Zadaj svoj e-mail" required />
    <button type="submit">Získať ID</button>
    <div id="successMsg"></div>
  </form>

  <script>
    emailjs.init("vn3f9l_KZwCYDZpKQ");

    const scriptURL = "https://script.google.com/macros/s/AKfycbxeS2s0jJiL6Bl3IRRxZDOVQHMoEndEegBOAvX2t-08A85QuXMiG6E1EFw3ZVWDEoe_/exec";

    document.getElementById("idForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value;

      fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify({ email: email }),
        headers: { "Content-Type": "application/json" },
      })
        .then((res) => res.json())
        .then((data) => {
          const uniqueID = data.id;

          const templateParams = {
            to_email: email,
            message: `Vaše výskumné ID je: ${uniqueID}`,
          };

          emailjs.send("service_x1q42bf", "template_22uiss7", templateParams)
            .then(() => {
              document.getElementById("successMsg").textContent = `ID ${uniqueID} bolo odoslané na ${email}.`;
              document.getElementById("idForm").reset();
            })
            .catch((error) => {
              document.getElementById("successMsg").textContent = "Nepodarilo sa odoslať e-mail.";
              console.error("EmailJS error:", error);
            });
        })
        .catch((error) => {
          document.getElementById("successMsg").textContent = "Nepodarilo sa získať ID.";
          console.error("Script fetch error:", error);
        });
    });
  </script>
</body>
</html>
