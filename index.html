<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <title>Generátor výskumného ID - JSONP</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: 60px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Získaj svoje výskumné ID</h2>
  <form id="idForm">
    <input type="email" id="email" placeholder="Zadaj svoj e-mail" required>
    <button type="submit">Získať ID</button>
  </form>
  <div id="result"></div>
  
  <script>
    // Inicializácia EmailJS s tvojím Public Key
    emailjs.init("vn3f9l_KZwCYDZpKQ");

    // Použi tu svoj nový Google Apps Script URL
    const scriptBaseURL = "https://script.google.com/macros/s/AKfycbzUOhHPCVYF2D4F1vjO-xn_tdY0J2ErWErJZgG7q7TcXAewIvCVs6i9ZXImG51SecQg/exec"; 
    const form = document.getElementById("idForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      result.textContent = "Generujem a odosielam ID...";

      // Vytvoríme <script> tag pre JSONP
      const script = document.createElement("script");
      const callbackName = "onIDResponse";
      // Pridáme aj parameter na zabránienie cache
      const randomParam = Math.floor(Math.random() * 999999);
      // Nastav URL s callback a cache parametrom
      script.src = scriptBaseURL + "?callback=" + callbackName + "&r=" + randomParam;
      
      // Definujeme callback funkciu, ktorá bude zavolaná z Apps Scriptu
      window[callbackName] = async function(data) {
        const uniqueID = data.id;
        try {
          // Odoslanie e-mailu cez EmailJS – používame premenné podľa tvojej šablóny
          const templateParams = {
            email: email,
            message: `Vaše výskumné ID je: ${uniqueID}`
          };
          
          await emailjs.send("service_x1q42bf", "template_22uiss7", templateParams);
          
          result.textContent = `ID ${uniqueID} bolo odoslané na ${email}.`;
        } catch (err) {
          console.error("EmailJS chyba:", err);
          result.textContent = "Nepodarilo sa odoslať e-mail.";
        }
        // Odstránime skript a callback po vykonaní
        document.body.removeChild(script);
        delete window[callbackName];
      };

      // Ak nastane chyba pri načítaní skriptu
      script.onerror = function() {
        result.textContent = "Nepodarilo sa získať ID (chyba scripta).";
        document.body.removeChild(script);
        delete window[callbackName];
      };

      document.body.appendChild(script);
    });
  </script>
</body>
</html>
