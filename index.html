<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <title>Generátor výskumného ID</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 400px;
      margin: 60px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    #result {
      margin-top: 20px;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Získaj svoje výskumné ID</h2>
  <form id="idForm">
    <input type="email" id="email" placeholder="Zadaj svoj e-mail" required />
    <button type="submit">Získať ID</button>
    <div id="result"></div>
  </form>

  <script>
    // Inicializácia EmailJS s tvojím Public Key
    emailjs.init("vn3f9l_KZwCYDZpKQ");
    
    // Použi tu svoj nový Google Apps Script URL
    const scriptURL = "https://script.google.com/macros/s/AKfycbzrrZhfclbEL6MzTF5ObDOxzX360S5W23sxzjvtOdA9OuNPKYgVd7Ajg2pIhqdHcESK/exec";
    
    document.getElementById("idForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const result = document.getElementById("result");
      result.textContent = "Generujem a odosielam ID...";
      
      try {
        // Získanie unikátneho ID z Google Apps Scriptu
        const response = await fetch(scriptURL);
        if (!response.ok) throw new Error("Chyba pri načítaní ID.");
        const data = await response.json();
        const uniqueID = data.id;
        
        // Odoslanie e-mailu cez EmailJS – používame premenné podľa tvojej šablóny ({{email}}, {{message}})
        const templateParams = {
          email: email,
          message: `Vaše výskumné ID je: ${uniqueID}`
        };
        
        await emailjs.send("service_x1q42bf", "template_22uiss7", templateParams);
        
        result.textContent = `ID ${uniqueID} bolo odoslané na ${email}.`;
        document.getElementById("idForm").reset();
      } catch (error) {
        console.error("Chyba:", error);
        result.textContent = "Nepodarilo sa získať alebo odoslať ID.";
      }
    });
  </script>
</body>
</html>
