<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Generátor výskumného ID</title>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>
<body>
  <h2>Získaj svoje výskumné ID</h2>
  <form id="idForm">
    <input type="email" id="email" placeholder="Zadaj svoj e-mail" required />
    <button type="submit">Získať ID</button>
    <div id="successMsg"></div>
  </form>

  <script>
    emailjs.init("vn3f9l_KZwCYDZpKQ");

    const scriptURL = "https://script.google.com/macros/s/AKfycbwsfAd0KP1-JzTkOPbZT9cyqY9KjjErH7kzWMehu3cMM1dInJ6gpmTp02POU84GH5B7/exec"; // https://script.google.com/macros/s/AKfycbzvXPBqTj0pd5ebGKprkOCshVFbLwHmBx3H4sD_Zakba0DO_EDkVUT7Jzi96WsG3dD0/exec

    document.getElementById("idForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;

      fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify({ email: email }),
        headers: { 'Content-Type': 'application/json' }
      })
      .then(response => response.text())
      .then(text => {
        try {
          const data = JSON.parse(text);
          const uniqueID = data.id;

          const templateParams = {
            to_email: email,
            message: `Vaše výskumné ID je: ${uniqueID}`
          };

          emailjs.send("service_x1q42bf", "template_22uiss7", templateParams)
            .then(() => {
              document.getElementById("successMsg").textContent = `ID ${uniqueID} bolo odoslané na ${email}.`;
              document.getElementById("idForm").reset();
            });
        } catch (err) {
          document.getElementById("successMsg").textContent = "Chyba pri spracovaní odpovede.";
        }
      });
    });
  </script>
</body>
</html>
